<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サムネイルジェネレーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }
  body {
    height: 100%;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #0f0f13;
    color: #e8e8f0;
    display: flex;
    flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    background: #1a1a24;
    border-bottom: 1px solid #2a2a3a;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header span { font-size: 12px; color: #888; background: #2a2a3a; padding: 2px 8px; border-radius: 99px; }
  .btn-reset {
    margin-left: auto;
    padding: 6px 16px; border: 1px solid #444; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
    background: #2a2a3a; color: #aaa; transition: all 0.15s; white-space: nowrap;
  }
  .btn-reset:hover { background: #3a2020; border-color: #c55; color: #ff9090; }

  .app {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  .panel {
    flex: 0 0 310px;
    min-height: 0;
    overflow-y: scroll;
    background: #1a1a24;
    border-right: 1px solid #2a2a3a;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-track { background: #1a1a24; }
  .panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .preview-area {
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    background: #0f0f13;
    gap: 0;
  }
  /* ズームバー（上部固定） */
  .zoom-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 20px;
    background: #15151e;
    border-bottom: 1px solid #2a2a3a;
  }
  .zoom-btn {
    background: #2a2a3a; border: 1px solid #333; color: #aaa;
    border-radius: 6px; width: 28px; height: 28px; cursor: pointer;
    font-size: 18px; line-height: 1; font-weight: 700; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:hover { background: #3a3a4a; color: #fff; }
  #zoomDisplay { font-size: 12px; color: #888; min-width: 42px; text-align:center; }
  .zoom-hint { font-size: 11px; color: #444; }
  /* キャンバスのスクロール領域 */
  .canvas-scroll {
    flex: 1 1 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    padding: 24px;
  }
  .canvas-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .canvas-scroll::-webkit-scrollbar-track { background: #0f0f13; }
  .canvas-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  /* プレビュー下部ラベル */
  .preview-footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 6px;
    font-size: 12px;
    color: #444;
  }

  /* ======= セクション ======= */
  .section {
    background: #22222e;
    border: 1px solid #2e2e3e;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .section-header {
    padding: 10px 14px;
    font-size: 12px; font-weight: 600; color: #aaa;
    letter-spacing: 0.06em;
    border-bottom: 1px solid #2e2e3e;
    background: #1e1e2a;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .section-header:hover { background: #252535; }
  .section-header .arrow { font-size: 10px; transition: transform 0.2s; }
  .section-header.collapsed .arrow { transform: rotate(-90deg); }
  .section-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .section-body.hidden { display: none; }

  /* ======= フォーム部品 ======= */
  label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  input[type="text"], select, textarea {
    width: 100%; background: #16161f; border: 1px solid #333;
    border-radius: 6px; color: #e8e8f0; font-size: 13px;
    padding: 7px 10px; outline: none; transition: border 0.2s; font-family: inherit;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: #6c63ff; }
  textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  select option { background: #1a1a24; }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }

  input[type="range"] { width: 100%; accent-color: #6c63ff; cursor: pointer; }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row input[type="range"] { flex: 1; }
  .range-val {
    font-size: 12px; color: #aaa; min-width: 42px; text-align: right;
    background: #16161f; border: 1px solid #333; border-radius: 4px; padding: 2px 5px;
  }

  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-row input[type="color"] {
    width: 36px; height: 32px; padding: 2px; border: 1px solid #333;
    border-radius: 6px; background: #16161f; cursor: pointer; flex-shrink: 0;
  }
  .color-row input[type="text"] { flex: 1; }

  .btn {
    width: 100%; padding: 9px 14px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .btn-secondary { background: #2a2a3a; color: #ccc; border: 1px solid #333; }
  .btn-secondary:hover { background: #333; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-success:hover { background: #16a34a; }

  .radio-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .radio-pill input { display: none; }
  .radio-pill label {
    padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 500;
    border: 1px solid #333; cursor: pointer; background: #16161f; color: #aaa; margin: 0;
    display: block; transition: all 0.15s;
  }
  .radio-pill input:checked + label { background: #6c63ff; border-color: #6c63ff; color: #fff; }

  .upload-area {
    border: 2px dashed #333; border-radius: 8px; padding: 14px;
    text-align: center; cursor: pointer; font-size: 12px; color: #666; transition: all 0.2s;
  }
  .upload-area:hover { border-color: #6c63ff; color: #aaa; }
  .upload-area input { display: none; }

  /* ======= Canvas ======= */
  .canvas-wrap { box-shadow: 0 8px 40px rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; flex-shrink: 0; margin: auto; }
  canvas { display: block; }
  .size-label { font-size: 12px; color: #555; }

  /* ======= テキストスタイルヒント ======= */
  .style-hint { font-size: 11px; color: #555; margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>🎨 サムネイルジェネレーター</h1>
  <span>Powered by Canvas API</span>
  <button class="btn-reset" onclick="resetAll()">🔄 リセット</button>
</header>

<div class="app">

  <!-- ===== 左パネル ===== -->
  <div class="panel">

    <!-- 比率 -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">📐 比率設定 <span class="arrow">▼</span></div>
      <div class="section-body">
        <div class="radio-group">
          <div class="radio-pill"><input type="radio" name="ratio" id="r169" value="169" checked><label for="r169">16:9</label></div>
          <div class="radio-pill"><input type="radio" name="ratio" id="rnote" value="note"><label for="rnote">note</label></div>
          <div class="radio-pill"><input type="radio" name="ratio" id="r52" value="52"><label for="r52">X記事</label></div>
          <div class="radio-pill"><input type="radio" name="ratio" id="r11" value="11"><label for="r11">1:1</label></div>
          <div class="radio-pill"><input type="radio" name="ratio" id="rcocona" value="cocona"><label for="rcocona">ココナラ</label></div>
        </div>
        <div class="size-label" id="sizeLabel">1920 × 1080 px</div>
      </div>
    </div>

    <!-- テキスト -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">✏️ テキスト設定 <span class="arrow">▼</span></div>
      <div class="section-body">
        <div>
          <label>タイトル</label>
          <textarea id="titleText" rows="3" placeholder="タイトルを入力…">サムネイルジェネレーター</textarea>
        </div>
        <div>
          <label>フォント</label>
          <select id="fontFamily">
            <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
            <option value="'M PLUS Rounded 1c', sans-serif">M PLUS Rounded（丸ゴシック）</option>
            <option value="'Zen Kaku Gothic New', sans-serif">Zen Kaku Gothic（極太角ゴシック）</option>
            <option value="'Rampart One', sans-serif">Rampart One（3D立体風）</option>
            <option value="'Cherry Bomb One', cursive">Cherry Bomb One（丸み3D・シャドーB向き）</option>
            <option value="'Kosugi Maru', sans-serif">Kosugi Maru（丸ゴシック）</option>
            <option value="'Kaisei Decol', serif">Kaisei Decol（装飾明朝）</option>
            <option value="Georgia, serif">Georgia</option>
          </select>
        </div>
        <!-- 文字揃え -->
        <div>
          <label>文字揃え</label>
          <div class="radio-group">
            <div class="radio-pill"><input type="radio" name="hAlign" id="haLeft" value="left"><label for="haLeft">左揃え</label></div>
            <div class="radio-pill"><input type="radio" name="hAlign" id="haCenter" value="center" checked><label for="haCenter">中央揃え</label></div>
            <div class="radio-pill"><input type="radio" name="hAlign" id="haRight" value="right"><label for="haRight">右揃え</label></div>
          </div>
        </div>
        <!-- 文字サイズ（横位置の上） -->
        <div>
          <label>文字サイズ</label>
          <div class="range-row">
            <input type="range" id="fontSize" min="24" max="240" value="72">
            <span class="range-val" id="fontSizeDisplay">72px</span>
          </div>
        </div>
        <!-- 横位置 -->
        <div>
          <label>横位置</label>
          <div class="range-row">
            <input type="range" id="textX" min="0" max="100" value="50">
            <span class="range-val" id="textXDisplay">50%</span>
          </div>
        </div>
        <!-- 縦位置 -->
        <div>
          <label>縦位置</label>
          <div class="range-row">
            <input type="range" id="textY" min="0" max="100" value="50">
            <span class="range-val" id="textYDisplay">50%</span>
          </div>
        </div>
        <!-- 行間 -->
        <div>
          <label>行間</label>
          <div class="range-row">
            <input type="range" id="lineHeight" min="0.8" max="3.0" step="0.1" value="1.4">
            <span class="range-val" id="lineHeightDisplay">1.4</span>
          </div>
        </div>
        <!-- テキストスタイル -->
        <div>
          <label>テキストスタイル</label>
          <div class="radio-group">
            <div class="radio-pill"><input type="radio" name="textEffect" id="teNormal" value="normal" checked><label for="teNormal">通常</label></div>
            <div class="radio-pill"><input type="radio" name="textEffect" id="teOutline" value="outline"><label for="teOutline">アウトライン</label></div>
            <div class="radio-pill"><input type="radio" name="textEffect" id="teEmboss" value="emboss"><label for="teEmboss">エンボス3D</label></div>
            <div class="radio-pill"><input type="radio" name="textEffect" id="teShadowB" value="shadowB"><label for="teShadowB">シャドーB</label></div>
          </div>
          <div class="style-hint" id="styleHint">通常：影設定が有効です</div>
        </div>
        <!-- テキストカラー -->
        <div>
          <label>テキストカラー</label>
          <div class="color-row">
            <input type="color" id="textColorPicker" value="#ffffff">
            <input type="text" id="textColorHex" value="#ffffff" placeholder="#rrggbb" maxlength="7">
          </div>
          <div class="radio-group" style="margin-top:6px;">
            <div class="radio-pill"><input type="radio" name="textColorPreset" id="tcWhite" value="#ffffff" checked><label for="tcWhite">White</label></div>
            <div class="radio-pill"><input type="radio" name="textColorPreset" id="tcDark" value="#1a1a1a"><label for="tcDark">Dark</label></div>
            <div class="radio-pill"><input type="radio" name="textColorPreset" id="tcCream" value="#fdf6e3"><label for="tcCream">Cream</label></div>
            <div class="radio-pill"><input type="radio" name="textColorPreset" id="tcYellow" value="#fbbf24"><label for="tcYellow">Yellow</label></div>
            <div class="radio-pill"><input type="radio" name="textColorPreset" id="tcCyan" value="#22d3ee"><label for="tcCyan">Cyan</label></div>
          </div>
        </div>
        <!-- テキスト影（通常モード時のみ有効） -->
        <div>
          <label>テキスト影（通常モード時）</label>
          <div class="radio-group">
            <div class="radio-pill"><input type="radio" name="textShadow" id="tsNone" value="none" checked><label for="tsNone">なし</label></div>
            <div class="radio-pill"><input type="radio" name="textShadow" id="tsLight" value="light"><label for="tsLight">ソフト</label></div>
            <div class="radio-pill"><input type="radio" name="textShadow" id="tsStrong" value="strong"><label for="tsStrong">強め</label></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 背景 -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">🎨 背景設定 <span class="arrow">▼</span></div>
      <div class="section-body">
        <div>
          <label>背景タイプ</label>
          <div class="radio-group">
            <div class="radio-pill"><input type="radio" name="bgType" id="bgSolid" value="solid" checked><label for="bgSolid">単色</label></div>
            <div class="radio-pill"><input type="radio" name="bgType" id="bgGradient" value="gradient"><label for="bgGradient">グラデ</label></div>
            <div class="radio-pill"><input type="radio" name="bgType" id="bgImage" value="image"><label for="bgImage">画像</label></div>
          </div>
        </div>
        <div id="solidBgArea">
          <label>背景色</label>
          <div class="color-row">
            <input type="color" id="bgColor" value="#1a1a2e">
            <input type="text" id="bgColorHex" value="#1a1a2e" placeholder="#rrggbb">
          </div>
        </div>
        <div id="gradBgArea" style="display:none;">
          <div class="row">
            <div><label>色①</label><input type="color" id="gradColor1" value="#6c63ff"></div>
            <div><label>色②</label><input type="color" id="gradColor2" value="#f093fb"></div>
          </div>
          <div style="margin-top:8px;">
            <label>方向</label>
            <select id="gradDir">
              <option value="lr">左→右</option>
              <option value="tb">上→下</option>
              <option value="tl">斜め(↘)</option>
              <option value="tr">斜め(↙)</option>
            </select>
          </div>
        </div>
        <div id="imgBgArea" style="display:none;">
          <div class="upload-area" onclick="document.getElementById('bgImageFile').click()">
            <input type="file" id="bgImageFile" accept="image/*">
            🖼️ クリックして背景画像を選択<br><span style="font-size:11px;">PNG / JPG</span>
          </div>
          <div id="bgImgName" style="font-size:11px;color:#666;margin-top:4px;"></div>
        </div>
      </div>
    </div>

    <!-- パターン -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">🔲 パターン <span class="arrow">▼</span></div>
      <div class="section-body">
        <div class="radio-group">
          <div class="radio-pill"><input type="radio" name="pattern" id="pNone" value="none"><label for="pNone">なし</label></div>
          <div class="radio-pill"><input type="radio" name="pattern" id="pDot" value="dot" checked><label for="pDot">ドット</label></div>
          <div class="radio-pill"><input type="radio" name="pattern" id="pGrid" value="grid"><label for="pGrid">グリッド</label></div>
        </div>
        <div>
          <label>透明度</label>
          <div class="range-row">
            <input type="range" id="patternOpacity" min="5" max="60" value="20">
            <span class="range-val" id="patternOpacityDisplay">20%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- オーバーレイ -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">🖼️ 画像オーバーレイ <span class="arrow">▼</span></div>
      <div class="section-body">
        <div class="upload-area" onclick="document.getElementById('overlayFile').click()">
          <input type="file" id="overlayFile" accept="image/*">
          🐑 キャラクター・ロゴを選択<br>
          <span style="font-size:11px;">PNG（背景透過）推奨</span>
        </div>
        <div id="overlayName" style="font-size:11px;color:#666;"></div>
        <div id="overlayControls" style="display:none; flex-direction:column; gap:8px;">

          <!-- ✂️ 背景透過 -->
          <div style="background:#1a1a2e; border:1px solid #2e2e3e; border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px;">
            <div style="font-size:11px; font-weight:600; color:#aaa; letter-spacing:0.05em;">✂️ 背景透過</div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary" id="removeBgBtn" onclick="removeBg()" style="flex:1; padding:8px 10px; font-size:12px;">✂️ 背景を透過</button>
              <button class="btn btn-secondary" id="restoreBgBtn" onclick="restoreOriginal()" style="display:none; flex:0 0 auto; padding:8px 10px; font-size:11px;">↩ 元に戻す</button>
            </div>
            <div>
              <label>許容範囲（広いほど多く除去）</label>
              <div class="range-row">
                <input type="range" id="bgTolerance" min="5" max="150" value="30">
                <span class="range-val" id="bgToleranceDisplay">30</span>
              </div>
            </div>
            <div id="removeBgStatus" style="font-size:11px; color:#666; text-align:center; min-height:14px;"></div>
          </div>

          <div style="border-top:1px solid #2e2e3e; margin: 2px 0;"></div>

          <div>
            <label>サイズ（キャンバス短辺比）</label>
            <div class="range-row">
              <input type="range" id="overlaySize" min="10" max="300" value="40">
              <span class="range-val" id="overlaySizeDisplay">40%</span>
            </div>
          </div>
          <div>
            <label>横位置（キャンバス外も可）</label>
            <div class="range-row">
              <input type="range" id="overlayX" min="-50" max="150" value="80">
              <span class="range-val" id="overlayXDisplay">80%</span>
            </div>
          </div>
          <div>
            <label>縦位置（キャンバス外も可）</label>
            <div class="range-row">
              <input type="range" id="overlayY" min="-50" max="150" value="50">
              <span class="range-val" id="overlayYDisplay">50%</span>
            </div>
          </div>
          <button class="btn btn-secondary" onclick="clearOverlay()">🗑 画像を削除</button>
        </div>
      </div>
    </div>

    <!-- ダウンロード -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">📥 ダウンロード <span class="arrow">▼</span></div>
      <div class="section-body">
        <button class="btn btn-success" onclick="downloadPNG()">📥 PNG ダウンロード</button>
        <div id="downloadHint" style="font-size:11px;color:#555;text-align:center;">高解像度PNGで出力されます</div>
      </div>
    </div>

  </div><!-- /panel -->

  <!-- ===== 右プレビュー ===== -->
  <div class="preview-area">
    <!-- ズームコントロール -->
    <div class="zoom-bar">
      <button class="zoom-btn" onclick="changeZoom(-25)">−</button>
      <span id="zoomDisplay">100%</span>
      <button class="zoom-btn" onclick="changeZoom(+25)">+</button>
      <span class="zoom-hint">プレビューズーム</span>
      <button class="zoom-btn" onclick="resetZoom()" style="font-size:11px; width:auto; padding:0 8px; margin-left:4px;">Fit</button>
    </div>
    <!-- スクロール可能なキャンバス領域 -->
    <div class="canvas-scroll" id="canvasScroll">
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
    </div>
    <div class="preview-footer" id="previewSizeLabel">1920 × 1080 px</div>
  </div>

</div><!-- /app -->

<script>
// ======================== STATE ========================
const S = {
  ratio: '169',
  titleText: 'サムネイルジェネレーター',
  fontFamily: "'Noto Sans JP', sans-serif",
  hAlign: 'center',  // 'left' | 'center' | 'right'
  textX: 50,         // 0–100 (%)
  textY: 50,         // 0–100 (%)
  fontSize: 72,
  lineHeight: 1.4,
  textColor: '#ffffff',
  textShadow: 'none',
  textEffect: 'normal', // 'normal' | 'outline' | 'emboss'
  bgType: 'solid', bgColor: '#1a1a2e',
  gradColor1: '#6c63ff', gradColor2: '#f093fb', gradDir: 'lr',
  pattern: 'dot', patternOpacity: 20,
  overlayImg: null, overlayImgOriginal: null, overlaySize: 40, overlayX: 80, overlayY: 50,
  bgImageObj: null,
};
const SIZES = { '169': [1920,1080], 'note': [1280,670], '52': [1200,480], '11': [800,800], 'cocona': [1220,1240] };

// ======================== CANVAS ========================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// プレビューズーム（state外：リセット不要）
let previewZoom = 100;

// キャンバス解像度をセット＋表示サイズを計算（内容はクリアされる→必ずdraw()を後で呼ぶ）
function initCanvas() {
  const [w, h] = SIZES[S.ratio];
  canvas.width = w; canvas.height = h;
  updateCanvasScale();
  document.getElementById('previewSizeLabel').textContent = `${w} × ${h} px`;
  document.getElementById('sizeLabel').textContent = `${w} × ${h} px`;
}

// 表示サイズのCSSのみ変更（キャンバス内容はクリアしない）
function updateCanvasScale() {
  const [w, h] = SIZES[S.ratio];
  const scroll = document.getElementById('canvasScroll');
  const previewW = Math.max(scroll.clientWidth  - 48, 100);
  const previewH = Math.max(scroll.clientHeight - 48, 100);
  const fitScale = Math.min(previewW / w, previewH / h, 1);
  const scale = fitScale * (previewZoom / 100);
  canvas.style.width  = Math.round(w * scale) + 'px';
  canvas.style.height = Math.round(h * scale) + 'px';
}

// ズームボタン：CSSサイズだけ変更（canvas.width は触らないのでクリアされない）
function changeZoom(delta) {
  previewZoom = Math.max(25, Math.min(300, previewZoom + delta));
  document.getElementById('zoomDisplay').textContent = previewZoom + '%';
  updateCanvasScale();
}
function resetZoom() {
  previewZoom = 100;
  document.getElementById('zoomDisplay').textContent = '100%';
  updateCanvasScale();
}

function draw() {
  const [w, h] = SIZES[S.ratio];
  ctx.clearRect(0, 0, w, h);

  // ---- 背景 ----
  if (S.bgType === 'solid') {
    ctx.fillStyle = S.bgColor; ctx.fillRect(0,0,w,h);
  } else if (S.bgType === 'gradient') {
    const dirs = { lr:[0,0,w,0], tb:[0,0,0,h], tl:[0,0,w,h], tr:[w,0,0,h] };
    const g = ctx.createLinearGradient(...dirs[S.gradDir]);
    g.addColorStop(0, S.gradColor1); g.addColorStop(1, S.gradColor2);
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  } else if (S.bgType === 'image' && S.bgImageObj) {
    const img = S.bgImageObj;
    const sc = Math.max(w/img.width, h/img.height);
    ctx.drawImage(img, (w-img.width*sc)/2, (h-img.height*sc)/2, img.width*sc, img.height*sc);
  } else {
    ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,w,h);
  }

  // ---- パターン ----
  if (S.pattern !== 'none') {
    ctx.save(); ctx.globalAlpha = S.patternOpacity / 100;
    if (S.pattern === 'dot') {
      ctx.fillStyle = '#fff';
      for (let x=16; x<w; x+=32) for (let y=16; y<h; y+=32) {
        ctx.beginPath(); ctx.arc(x,y,1.5,0,Math.PI*2); ctx.fill();
      }
    } else if (S.pattern === 'grid') {
      ctx.strokeStyle='#fff'; ctx.lineWidth=0.8;
      for (let x=0; x<=w; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
      for (let y=0; y<=h; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    }
    ctx.restore();
  }

  // ---- オーバーレイ画像 ----
  if (S.overlayImg) {
    const img = S.overlayImg;
    // サイズ：キャンバス短辺の S.overlaySize%
    const sz = (S.overlaySize / 100) * Math.min(w, h);
    const aspect = img.width / img.height;
    const dw = sz * aspect, dh = sz;
    // 中心座標（キャンバス外もOK）
    const cx = (S.overlayX / 100) * w;
    const cy = (S.overlayY / 100) * h;
    ctx.drawImage(img, cx - dw/2, cy - dh/2, dw, dh);
  }

  // ---- テキスト ----
  const text = S.titleText.trim();
  if (text) {
    // Zen Kaku Gothic New / MPLUS1 は900wt専用、他は700
    const fw = (S.fontFamily.includes('Zen Kaku') || S.fontFamily.includes('MPLUS1')) ? '900' : '700';
    ctx.font = `${fw} ${S.fontSize}px ${S.fontFamily}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = S.hAlign;

    const lines = text.split('\n');
    const lh = S.fontSize * S.lineHeight;

    // テキストブロックの基準Y（ブロック中心が textY% の位置）
    const blockH = lines.length * lh;
    const baseY = (S.textY / 100) * h - blockH / 2 + lh / 2;

    // X位置（揃え方向のアンカー）
    const ax = (S.textX / 100) * w;

    lines.forEach((ln, i) => {
      const ly = baseY + i * lh;

      if (S.textEffect === 'outline') {
        // ---- アウトライン ----
        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
        const sw = Math.max(4, S.fontSize * 0.1);
        ctx.lineWidth = sw;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(0,0,0,0.92)';
        ctx.strokeText(ln, ax, ly);
        ctx.fillStyle = S.textColor;
        ctx.fillText(ln, ax, ly);

      } else if (S.textEffect === 'emboss') {
        // ---- エンボス3D ----
        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
        const depth = Math.max(3, Math.round(S.fontSize * 0.06));
        // 奥から手前に向かって影レイヤーを重ねる
        for (let d = depth; d >= 1; d--) {
          const alpha = 0.55 * (d / depth);
          ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(2)})`;
          ctx.fillText(ln, ax + d * 0.7, ly + d * 0.7);
        }
        // メイン塗り
        ctx.fillStyle = S.textColor;
        ctx.fillText(ln, ax, ly);
        // 薄いストロークでエッジを締める
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';
        ctx.strokeText(ln, ax, ly);
        // ハイライト（左上に光）
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillText(ln, ax - 1.5, ly - 1.5);

      } else if (S.textEffect === 'shadowB') {
        // ---- シャドーB（モトヤ装飾シャドーB方式） ----
        // ① 影（textColor）をオフセット位置に塗る
        // ② 本体を背景色で塗りつぶす（透明に見せる）
        // ③ 輪郭線（textColor）を細く乗せる
        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
        const off = Math.max(4, Math.round(S.fontSize * 0.1));
        const bodyCol = S.bgType === 'solid'    ? S.bgColor
                      : S.bgType === 'gradient' ? S.gradColor1
                      : '#000000';
        // ① 影
        ctx.fillStyle = S.textColor;
        ctx.fillText(ln, ax + off, ly + off);
        // ② 本体を背景色で上書き（見た目を透明化）
        ctx.fillStyle = bodyCol;
        ctx.fillText(ln, ax, ly);
        // ③ 輪郭
        ctx.strokeStyle = S.textColor;
        ctx.lineWidth = Math.max(1.5, S.fontSize * 0.03);
        ctx.lineJoin = 'round';
        ctx.strokeText(ln, ax, ly);

      } else {
        // ---- 通常 ----
        const shadows = {
          none:   [0, 0, 0,  'transparent'],
          light:  [2, 2, 12, 'rgba(0,0,0,.4)'],
          strong: [3, 3, 20, 'rgba(0,0,0,.8)']
        };
        const sh = shadows[S.textShadow] || shadows.none;
        ctx.shadowOffsetX = sh[0]; ctx.shadowOffsetY = sh[1];
        ctx.shadowBlur = sh[2];    ctx.shadowColor = sh[3];
        ctx.fillStyle = S.textColor;
        ctx.fillText(ln, ax, ly);
      }
    });

    // 影のリセット
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  }
}

function on(id, ev, fn) { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
function setRange(id, dispId, prop, suffix='') {
  on(id, 'input', function() {
    S[prop] = +this.value;
    document.getElementById(dispId).textContent = this.value + suffix;
    draw();
  });
}

// ======================== BACKGROUND REMOVAL ========================
on('bgTolerance', 'input', function() {
  document.getElementById('bgToleranceDisplay').textContent = this.value;
});

function removeBg() {
  if (!S.overlayImg) return;
  // 元画像を保存（初回のみ）
  if (!S.overlayImgOriginal) S.overlayImgOriginal = S.overlayImg;

  const btn = document.getElementById('removeBgBtn');
  const status = document.getElementById('removeBgStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 処理中…';
  status.textContent = '';

  const tol = +document.getElementById('bgTolerance').value;

  // ★ 常にオリジナルから処理する
  const sourceImg = S.overlayImgOriginal;

  setTimeout(() => {
    const dataURL = doRemoveBg(sourceImg, tol);
    const newImg = new Image();
    newImg.onload = () => {
      S.overlayImg = newImg;
      document.getElementById('restoreBgBtn').style.display = '';
      btn.textContent = '✂️ 再透過';
      btn.disabled = false;
      status.textContent = '✅ 背景を透過しました';
      setTimeout(() => status.textContent = '', 2000);
      draw();
    };
    newImg.src = dataURL;
  }, 50);
}

function doRemoveBg(img, tolerance) {
  const w = img.naturalWidth  || img.width;
  const h = img.naturalHeight || img.height;
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const octx = oc.getContext('2d');
  octx.drawImage(img, 0, 0);

  const imageData = octx.getImageData(0, 0, w, h);
  const data = imageData.data;

  function px(x, y) {
    const i=(y*w+x)*4;
    if (data[i+3] === 0) return null;
    return [data[i],data[i+1],data[i+2]];
  }
  const samples = [];
  const step = Math.max(1, Math.floor(Math.min(w, h) / 16));
  for (let x = 0; x < w; x += step) { samples.push(px(x, 0)); samples.push(px(x, h-1)); }
  for (let y = 0; y < h; y += step) { samples.push(px(0, y)); samples.push(px(w-1, y)); }
  const validSamples = samples.filter(s => s !== null);
  if (validSamples.length === 0) return oc.toDataURL('image/png');

  const rs = validSamples.map(c=>c[0]).sort((a,b)=>a-b);
  const gs = validSamples.map(c=>c[1]).sort((a,b)=>a-b);
  const bs = validSamples.map(c=>c[2]).sort((a,b)=>a-b);
  const mid = (rs.length / 2) | 0;
  const bgR = rs[mid], bgG = gs[mid], bgB = bs[mid];

  for (let p = 0; p < w * h; p++) {
    const i = p * 4;
    const dr = data[i]   - bgR;
    const dg = data[i+1] - bgG;
    const db = data[i+2] - bgB;
    if (Math.sqrt(dr*dr + dg*dg + db*db) <= tolerance) {
      data[i+3] = 0;
    }
  }

  const alpha = new Uint8Array(w * h);
  for (let p = 0; p < w*h; p++) alpha[p] = data[p*4+3];

  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      const p = y*w+x;
      if (alpha[p] === 0) continue;
      const t = (alpha[p-1]===0?1:0) + (alpha[p+1]===0?1:0)
              + (alpha[p-w]===0?1:0) + (alpha[p+w]===0?1:0);
      if (t >= 2) data[p*4+3] = 80;
      else if (t === 1) data[p*4+3] = 160;
    }
  }

  octx.putImageData(imageData, 0, 0);
  return oc.toDataURL('image/png');
}

function restoreOriginal() {
  if (!S.overlayImgOriginal) return;
  S.overlayImg = S.overlayImgOriginal;
  S.overlayImgOriginal = null;
  document.getElementById('restoreBgBtn').style.display = 'none';
  document.getElementById('removeBgBtn').textContent = '✂️ 背景を透過';
  const status = document.getElementById('removeBgStatus');
  status.textContent = '↩ 元の画像に戻しました';
  setTimeout(() => status.textContent = '', 1500);
  draw();
}
